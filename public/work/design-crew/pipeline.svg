<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" role="img" aria-labelledby="t d">
<title id="t">Design-crew pipeline</title>
<desc id="d">Left-to-right agent pipeline: brief, domain modeler, IA architect, human gate 1, system designer, parallel builders, token linter and UX critic with a fix-rounds loop, human gate 2, storyteller, honesty checker, published. Files pass between stages; every agent appends to a shared decisions and metrics ledger.</desc>

.h{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,sans-serif;font-weight:700}
.b{font-family:"Mona Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",sans-serif}
.s{font-family:Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif;font-style:italic}
.m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.tag{font-size:15px;letter-spacing:1.6px;font-weight:600;fill:#a39c8f}
.nm{font-size:25px;fill:#f1ece3;letter-spacing:-.2px}
.jb{font-size:19px;fill:#a39c8f}
.pl{font-size:14px;letter-spacing:1.4px;font-weight:700}
.el{font-size:17px;fill:#d3ccbf}
.e{stroke:#8a8375;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dot{stroke:#6f695e;stroke-width:2;stroke-dasharray:.1 7;stroke-linecap:round;fill:none}
</style>

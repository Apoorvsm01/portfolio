<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" width="2400" height="1200" role="img" aria-labelledby="t d">
<title id="t">Fleet Console information architecture</title>
<desc id="d">Workflow-first IA. Six navigation verbs on top: Now, Inbox, Owned, Review, Fleet, Plan. Now, Inbox, Owned and Review lead to one canonical Incident page, which is reachable from five parents. Objects underneath: Vehicle, Drive, Operator, Shift, Escalation, Footage review. Object-first and time-first models were rejected.</desc>

<!doctype html>
<!--
  Source of public/og.png, the 1200x630 share card. Re-render after editing:
  "/Applications/Google Chrome Beta.app/Contents/MacOS/Google Chrome Beta" --headless=new --hide-scrollbars \
    --user-data-dir=/tmp/og-chrome --window-size=1200,630 --virtual-time-budget=6000 \
    --screenshot=public/og.png "file://$PWD/scripts/og-card.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=block"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #12110f;
        color: #f1ece3;
        font-family: "Geist", system-ui, sans-serif;
      }
      .aurora span { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.42; }
      .a1 { width: 620px; height: 620px; left: -180px; top: -240px; background: #4aa3ff; }
      .a2 { width: 560px; height: 560px; right: -160px; top: -200px; background: #ee5c96; }
      .a3 { width: 520px; height: 520px; right: 180px; bottom: -380px; background: #f5a524; opacity: 0.28; }
      .orb {
        position: absolute;
        right: 96px;
        top: 150px;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.7), transparent 34%),
          radial-gradient(circle at 70% 68%, #ee5c96, transparent 56%),
          radial-gradient(circle at 28% 74%, #4aa3ff, transparent 58%),
          radial-gradient(circle at 70% 26%, #f5a524, transparent 52%),
          radial-gradient(circle at 50% 50%, #3cc8b4, transparent 70%),
          #a98cf5;
        box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.35), 0 0 120px rgba(169, 140, 245, 0.45);
        filter: saturate(1.05) blur(0.4px);
      }
      .content { position: absolute; left: 88px; top: 92px; width: 680px; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 18px 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(182, 224, 90, 0.5);
        background: rgba(182, 224, 90, 0.12);
        font-size: 22px;
        font-weight: 600;
      }
      .status i { width: 12px; height: 12px; border-radius: 50%; background: #b6e05a; display: block; }
      h1 {
        margin-top: 34px;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 112px;
        line-height: 0.98;
        letter-spacing: -1.5px;
      }
      .role {
        margin-top: 22px;
        font-size: 36px;
        font-weight: 500;
        background: linear-gradient(100deg, #4aa3ff, #a98cf5 40%, #ee5c96 72%, #f5a524);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tags { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
      .tags span {
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid #2b2823;
        background: #1b1916;
        font-size: 21px;
        color: #c9c2b5;
      }
      .url { position: absolute; left: 88px; bottom: 56px; font-size: 22px; color: #a39c8f; letter-spacing: 0.3px; }
    </style>
  </head>
  <body>
    <div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
    <div class="orb"></div>
    <div class="content">
      <div class="status"><i></i>Looking for my next team</div>
      <h1>Apoorv Mahajan</h1>
      <p class="role">UX Engineer &amp; Product Designer</p>
      <div class="tags">
        <span>In-car AI · Woven by Toyota</span>
        <span>Apple Vision Pro</span>
        <span>Health</span>
        <span>Research to code</span>
      </div>
    </div>
    <p class="url">apoorvsm01.github.io/portfolio</p>
  </body>
</html>
